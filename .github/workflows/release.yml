name: release

# Cut a release by pushing a tag like `v0.1.0`. One macOS job (Apple Silicon,
# which cross-compiles the Intel target — the macOS SDK is universal) and one
# Linux job, independent (fail-fast: false) so one failing never stops the other.
# A stalled queue delays the release for every platform until that job ends.
# Asset names are `utiman-<target-triple>.tar.gz`,
# the contract `utiman self-update` (pk-cli-selfupdate) matches on.
#
# `publish` attaches whatever was built to a draft, even when one build failed, and
# publishes it only once every expected asset is there. A missing one fails the
# run and leaves the draft, and `self-update` keeps finding the last whole release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Gate the whole release on the pushed tag matching Cargo.toml's version.
  # `cargo build` bakes `env!("CARGO_PKG_VERSION")` into the binary as the
  # value `utiman self-update` compares against, so a tag/manifest mismatch
  # would ship binaries that self-report the wrong version and quietly break
  # the update check. One fast job the build matrix depends on catches it
  # before anything is built or published.
  verify:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal Cargo.toml version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')"
          echo "pushed tag: v$tag   Cargo.toml version: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Release tag v$tag does not match Cargo.toml version $manifest. Bump Cargo.toml (or retag) so the binary's baked-in version matches the release — utiman self-update compares against it." >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: apple (aarch64 + x86_64)
            targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            name: linux x86_64
            targets: "x86_64-unknown-linux-gnu"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package each target
        run: |
          for t in ${{ matrix.targets }}; do
            rustup target add "$t"
            cargo build --release --target "$t"
            tar -C "target/$t/release" -czf "utiman-$t.tar.gz" utiman
            shasum -a 256 "utiman-$t.tar.gz" > "utiman-$t.tar.gz.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            utiman-*.tar.gz
            utiman-*.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

  # The one job that can write. Parallel build jobs creating a draft for the same
  # tag could each make their own, so they hand over artifacts and this attaches
  # them all, then publishes only when nothing expected is missing.
  publish:
    name: publish the release
    needs: [verify, build]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          files: |
            dist/utiman-*.tar.gz
            dist/utiman-*.tar.gz.sha256
      - name: Every expected asset was attached
        run: |
          set -euo pipefail
          missing=0
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            for f in "utiman-$t.tar.gz" "utiman-$t.tar.gz.sha256"; do
              [ -f "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
            done
          done
          exit "$missing"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run of an older tag must not move Latest back to it.
          current=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          newest=$(printf '%s\n%s\n' "$current" "$GITHUB_REF_NAME" | sort -V | tail -1)
          latest=false; [ "$newest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
